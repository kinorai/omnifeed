name: Continuous Integration and Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual release: force a versioned rebuild + image push without a releasable
  # commit — e.g. a base-image CVE with no Dependabot PR, or shipping a
  # build/ci/refactor change. Actions tab → "Run workflow" (on main).
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for the forced release"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read    # least-privilege default; write-needing jobs declare it per-job

env:
  GO_VERSION: "1.26.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'develop' && github.event.pull_request.head.ref != 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # All lint checks delegate to Makefile targets so this job stays
      # in lockstep with the pre-commit hooks. To change a check, edit
      # the Makefile and both layers pick it up. See .pre-commit-config.yaml.
      - name: gofmt check (make fmt-check)
        run: make fmt-check

      - name: go vet (make vet)
        run: make vet

      # Install golangci-lint via the action (handles caching + binary
      # download). Then run via `make lint` to keep the contract local.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          install-only: true

      - name: golangci-lint (make lint)
        run: make lint

      - name: golangci-lint config verify (make config-verify)
        run: make config-verify

      - name: go mod tidy drift (make tidy-check)
        run: make tidy-check

      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref != 'develop' && github.event.pull_request.head.ref != 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests with race detector and coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.txt

  # On every PR: the SINGLE image build. Multi-arch (amd64+arm64) via the
  # cross-compiling Dockerfile — native Go cross-compile, no QEMU. Pushed as
  # :edge only on trusted PRs (non-fork, non-Dependabot, which hold registry
  # secrets); forks/bots build-only (push=false), which still validates the
  # Dockerfile builds for both arches. Each trusted PR push overwrites :edge.
  image_pr:
    name: Build & Push Edge Image
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/image.yml
    with:
      tags: kinorai/omnifeed:edge
      version: edge
      push: ${{ github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' }}
    secrets: inherit

  # On push to develop: the SINGLE image build → multi-arch :dev for integration
  # testing of in-progress work.
  image_dev:
    name: Build & Push Dev Image
    needs: [lint, test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/image.yml
    with:
      tags: kinorai/omnifeed:dev
      version: dev
      push: true
    secrets: inherit

  # On push to main: git-cliff computes the next semver from the Conventional
  # Commits since the last tag, regenerates CHANGELOG.md, commits it, and tags
  # vX.Y.Z. Then goreleaser (release job) builds binaries + multi-arch image +
  # checksums + SBOM from that tag.
  #
  # The git tag is the single source of truth — goreleaser uses `{{ .Version }}`
  # and the Makefile uses `git describe --tags`; there is no package.json or
  # tracked version file. Releases are cut for feat/fix/perf and dependency
  # bumps (chore(deps)/chore(docker)); other types skip cleanly. A manual
  # workflow_dispatch forces a release on demand (e.g. base-image CVE). See cliff.toml.
  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Auto on push to main; or on demand via workflow_dispatch (forced release).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write   # push the release commit + tag
    outputs:
      skipped: ${{ steps.decide.outputs.skipped }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Auto path only: git-cliff prints the next version to stdout (exposed as
      # `content`); returns the current latest tag unchanged when nothing is
      # releasable. The manual path computes the version in the decide step.
      - name: Compute next version
        id: bump
        if: github.event_name == 'push'
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Decide whether to release
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          NEXT: ${{ steps.bump.outputs.content }}
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Forced release: git-cliff won't bump without releasable commits,
            # so increment the latest tag by the chosen level here.
            v="${latest#v}"; v="${v:-0.0.0}"
            major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
            case "${BUMP:-patch}" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              *)     next="v${major}.${minor}.$((patch + 1))" ;;
            esac
            echo "Manual ${BUMP:-patch} release: ${latest:-<none>} -> ${next}"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "tag=${next}" >> "$GITHUB_OUTPUT"
          else
            next="$(printf '%s' "$NEXT" | tr -d '[:space:]')"
            echo "Latest tag  : ${latest:-<none>}"
            echo "Next version: ${next:-<none>}"
            if [ -z "$next" ] || [ "$next" = "$latest" ]; then
              echo "No releasable commits (feat/fix/perf/deps) since ${latest:-the beginning} — skipping."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
            else
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              echo "tag=${next}" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Auto only: regenerate the changelog, promoting "unreleased" to the bumped
      # version. Skipped on manual runs — a forced release has no releasable
      # commits to add (it ships skipped/no changes), so it just tags + rebuilds;
      # goreleaser's release notes still document the commits, and CHANGELOG.md
      # self-heals on the next auto release.
      - name: Generate changelog
        if: steps.decide.outputs.skipped != 'true' && github.event_name == 'push'
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --bump -o CHANGELOG.md

      # Commit the changelog and create the annotated tag. [skip ci] keeps the
      # release commit from re-triggering this workflow (pushes by GITHUB_TOKEN
      # don't trigger workflows anyway, and tag pushes aren't a CI trigger).
      - name: Commit, tag, and push
        if: steps.decide.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          # --allow-empty: a manual pure-rebuild may add no changelog entry, but
          # we still want the release commit + tag (goreleaser rebuilds the image).
          git commit -m "chore(release): ${TAG} [skip ci]" --allow-empty
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin main "refs/tags/${TAG}"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: versioning
    if: needs.versioning.outputs.skipped != 'true'
    permissions:
      contents: write   # goreleaser publishes the GitHub Release + uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.versioning.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
