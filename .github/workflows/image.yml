name: Build image

# Reusable multi-arch image build for the non-release channels:
# PR → :edge, develop → :dev. (Release images come from goreleaser.)
#
# The Dockerfile cross-compiles via `--platform=$BUILDPLATFORM` + GOARCH, so the
# arm64 image is built natively on the amd64 runner (no QEMU emulation). One
# build, both arches, ~1.5 min instead of ~5.5 min under QEMU — and Go's
# cross-compile means we don't need a per-arch native-runner matrix.
on:
  workflow_call:
    inputs:
      tags:
        description: "Newline-separated docker tags (full refs, e.g. kinorai/omnifeed:edge)"
        required: true
        type: string
      version:
        description: "Version stamped into the binary (release tag, or edge/dev)"
        required: false
        default: "dev"
        type: string
      push:
        description: "Push to the registry (false = build-only validation, e.g. forks)"
        required: false
        default: false
        type: boolean
      ref:
        description: "Git ref to build (default: the triggering ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # Registry login only when we intend to push (forks/Dependabot lack secrets
      # and build-only, so they never reach this step).
      - if: ${{ inputs.push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          build-args: |
            VERSION=${{ inputs.version }}
          # Attach SBOM + provenance to pushed images (skipped on build-only).
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=omnifeed-image
          cache-to: type=gha,mode=max,scope=omnifeed-image
