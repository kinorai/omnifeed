name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - '.github/workflows/docs.yml'

env:
  GO_VERSION: '1.26.6'

jobs:
  build-and-deploy-docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
      - name: Generate Go package docs
        run: |
          mkdir -p docs/api
          gomarkdoc --output 'docs/api/{{.Dir}}.md' ./...
      - name: Generate API index
        run: |
          {
            echo '# API reference'
            echo
            echo 'Generated from the Go source by [gomarkdoc](https://github.com/princjef/gomarkdoc).'
            echo
            find docs/api -name '*.md' ! -name index.md | sort | sed 's|^docs/api/||' | while read -r f; do
              echo "- [${f%.md}]($f)"
            done
          } > docs/api/index.md
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
