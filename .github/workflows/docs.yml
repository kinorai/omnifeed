name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - '.github/workflows/docs.yml'

env:
  GO_VERSION: '1.26.10'
  # Pinned: the tool runs on every push to main. Bump deliberately.
  GOMARKDOC_VERSION: v1.1.0

permissions: {}

jobs:
  # Builds the site with a read-only token that is not left on disk, so
  # nothing gomarkdoc or its dependencies run can write to the repo.
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No cache: the deploy job never restores it, and a cache written
          # here must not be one another workflow trusts.
          cache: false
      - name: Install gomarkdoc
        run: go install "github.com/princjef/gomarkdoc/cmd/gomarkdoc@${GOMARKDOC_VERSION}"
      - name: Generate Go package docs
        run: |
          mkdir -p docs/api
          gomarkdoc --output 'docs/api/{{.Dir}}.md' ./...
      - name: Generate API index
        run: |
          {
            echo '# API reference'
            echo
            echo 'Generated from the Go source by [gomarkdoc](https://github.com/princjef/gomarkdoc).'
            echo
            find docs/api -name '*.md' ! -name index.md | sort | sed 's|^docs/api/||' | while read -r f; do
              echo "- [${f%.md}]($f)"
            done
          } > docs/api/index.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs
          retention-days: 1

  # Holds the write token and runs no repo or third-party tool code: it only
  # publishes the files the build job produced.
  deploy-docs:
    name: Deploy Documentation
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy action works through a git worktree, so it needs the repo
      # checked out. No repo code runs here, and the token is not saved to disk.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docs
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: docs
          branch: gh-pages
