version: 2
# gomod + docker bumps merge as chore(deps)/chore(docker), which cut a patch
# release (goreleaser rebuilds + pushes the image), so security fixes reach
# production — see cliff.toml. Each ecosystem's updates are grouped into one PR
# so a week of bumps lands as a single merge → a single release, not one per dep.
# chore(actions) does not release (CI-only, no artifact change).
# cooldown holds every bump until its release is 7 days old, so a hijacked or
# broken release is usually caught and pulled upstream before it reaches us.
# Security updates ignore it.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  # The dev tools pinned in tools/go.mod (govulncheck). They never ship in
  # the binary or the image, so chore(tools) does not cut a release.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(tools)"
    groups:
      go-tools:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns: ["*"]
