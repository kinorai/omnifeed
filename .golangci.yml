version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck   # subsumes the v1 'gosimple' linter
    - unused
    - bodyclose
    - copyloopvar
    - gocritic
    - misspell
    - revive
    - unconvert
    # gosec runs here, not as its own job: the golangci-lint we pin (ci.yml,
    # Makefile) is bumped with the repo's Go, and CI fails if it lags, while
    # the securego/gosec action runs the previous release's image (one Go
    # version behind), and pinning gosec in tools/go.mod would pull its
    # AI-SDK modules in.
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"

  exclusions:
    paths:
      - testdata
    rules:
      - path: _test\.go$
        linters:
          - errcheck
      # Test fixtures read testdata through variable paths (G304) and
      # carry fake credentials (G101).
      - path: _test\.go$
        linters:
          - gosec
        text: "G(101|304)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
