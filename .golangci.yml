version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck   # subsumes the v1 'gosimple' linter
    - unused
    - bodyclose
    - copyloopvar
    - gocritic
    - misspell
    - revive
    - unconvert
    # gosec runs here, not as its own job: golangci-lint is built with the
    # repo's Go, while the securego/gosec action runs the previous release's
    # image (one Go version behind) and pulls AI-SDK modules into tools/go.mod.
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "disableStutteringCheck"

  exclusions:
    paths:
      - testdata
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          # Test fixtures read testdata through variable paths (G304) and
          # carry fake credentials (G101).
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
