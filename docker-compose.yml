# Full stack: searxng (web search) + crawl4ai (crawling) upstreams with
# omnifeed in front of both.
# Use this to point Open WebUI's external loader at http://localhost:8080
# (set WEB_LOADER_ENGINE=external and EXTERNAL_WEB_LOADER_URL=http://...).

# Pin the project name so the network is always `omnifeed_default`, regardless of
# the directory you run this from — the stdio MCP example in the README joins it.
name: omnifeed

services:
  searxng:
    # Pinned after the 2026-07-30 perf benchmark. SearXNG publishes no semver
    # releases — dated tags are the only release scheme.
    image: searxng/searxng:2026.8.3-0734ee6c7
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: dev-only-change-me
      # Granian worker threads (image default 4): with 4, a 5th simultaneous
      # search queues behind the others. Searches are ~95% network wait, so the
      # extra threads cost only idle memory, and the limiter is off here so
      # raising this cannot trip bot detection.
      GRANIAN_BLOCKING_THREADS: "12"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  crawl4ai:
    # Pinned after the 2026-07-30 perf benchmark: 0.9.2 is the first release with
    # usable preserve_tags (needed to keep code blocks intact).
    image: unclecode/crawl4ai:0.9.2
    container_name: crawl4ai
    ports:
      - "11235:11235"
    environment:
      # crawl4ai 0.9.x binds loopback-only until a token is set, and gates its
      # API on it — omnifeed sends the same value via OMNIFEED_CRAWL4AI_TOKEN.
      CRAWL4AI_API_TOKEN: crawl4ai-dev-token
      # The Reddit engine runs an in-page fetch via POST /execute_js, which 0.9.x
      # ships disabled by default. Enable it (token-gated, reachable by this stack only).
      CRAWL4AI_EXECUTE_JS_ENABLED: "true"
      CRAWL4AI_HOOKS_ENABLED: "false"
      MAX_CONCURRENT_TASKS: "25"
    healthcheck:
      # crawl4ai's /health only answers GET (HEAD → 405), so use a GET probe
      # (-O /dev/null) instead of wget --spider, which sends HEAD.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: kinorai/omnifeed:latest
    container_name: omnifeed
    ports:
      - "8080:8080"   # Open WebUI loader (POST /crawl)
      - "8081:8081"   # MCP HTTP/SSE
      - "9090:9090"   # Prometheus /metrics + /livez /readyz
    environment:
      OMNIFEED_CRAWL4AI_URL: http://crawl4ai:11235/crawl
      OMNIFEED_SEARXNG_URL: http://searxng:8080
      OMNIFEED_CRAWL4AI_TOKEN: crawl4ai-dev-token  # must match crawl4ai's CRAWL4AI_API_TOKEN
      # Set OMNIFEED_API_KEY to require Authorization: Bearer ... on /crawl.
      # OMNIFEED_API_KEY: changeme
      # Without OMNIFEED_API_KEY the proxy refuses to start; this is the explicit
      # local opt-out (production must set OMNIFEED_API_KEY instead).
      OMNIFEED_DEV_NO_AUTH: "true"
      OMNIFEED_LOG_LEVEL: info
      OMNIFEED_LOG_FORMAT: json
      # Pace the search engines behind SearXNG. Off by default because the
      # right numbers depend on your engine pool; these are a measured starting
      # point. DELAY spaces sends, QUOTA bounds the burst over a rolling window,
      # CONCURRENCY caps searches in flight so a fanned-out client is not
      # serialized. All three work on this single-instance stack with no Redis.
      # OMNIFEED_SEARXNG_DELAY: 1s
      # OMNIFEED_SEARXNG_QUOTA: "10"
      # OMNIFEED_SEARXNG_CONCURRENCY: "8"
      # Share the rate limiters' state through Redis so several replicas obey
      # one limit instead of one each. Uncomment together with the redis
      # service below (and start the stack with `--profile redis`); unset, each
      # instance paces in its own memory, which is all a single one needs.
      # OMNIFEED_REDIS_URL: redis://redis:6379/0
    depends_on:
      crawl4ai:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped

  # Distributed rate limiting, off by default: a single omnifeed instance paces
  # correctly in its own memory, so this only earns its keep once you run more
  # than one. Guarded by the "redis" profile — start it with
  #   docker compose --profile redis up
  # and uncomment OMNIFEED_REDIS_URL on the proxy service above.
  redis:
    image: redis:8.10.1-alpine
    container_name: omnifeed-redis
    profiles: ["redis"]
    # No password: this listens on the compose network only, and no omnifeed
    # deployment should share a Redis with anything it does not trust. Set
    # --requirepass here and a redis://:<pass>@redis:6379 URL above if yours
    # does. Persistence is off on purpose: every key is pacing state with a TTL
    # of seconds to minutes, so an empty Redis after a restart is correct.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Stdio MCP, for clients that only speak stdio. Prefer the HTTP transport on
  # :8081 (the proxy service above) when this stack is already up. Guarded by the
  # "mcp" profile so `docker compose up` never starts it — an MCP client launches
  # it on demand, keeping all config (upstreams, network, image) in this file:
  #   docker compose -f /abs/path/docker-compose.yml run -T --rm mcp
  mcp:
    image: kinorai/omnifeed:latest
    profiles: ["mcp"]
    command: ["--mcp-stdio"]
    environment:
      OMNIFEED_CRAWL4AI_URL: http://crawl4ai:11235/crawl
      OMNIFEED_SEARXNG_URL: http://searxng:8080
      OMNIFEED_CRAWL4AI_TOKEN: crawl4ai-dev-token  # must match crawl4ai's CRAWL4AI_API_TOKEN
    depends_on:
      crawl4ai:
        condition: service_healthy
      searxng:
        condition: service_healthy
